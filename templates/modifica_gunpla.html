{% extends "base.html" %}
{% block title %}Modifica Kit #{{ gunpla.id_gunpla }} | Wing Zero ERP{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h2 class="fw-bold mb-0">Modifica Scorte Gunpla #{{ gunpla.id_gunpla }}</h2>
        </div>

        <div class="card p-4 shadow-sm">
            <p class="mb-1"><strong>Modello:</strong> {{ gunpla.nome_modello }}</p>
            <p class="mb-3"><strong>Giacenza Attuale:</strong> <span class="badge bg-info text-dark fs-6">{{ gunpla.quantita }} pz</span></p>

            <form method="POST" action="{{ url_for('modifica_gunpla', id_gunpla=gunpla.id_gunpla) }}">
                <div class="row g-3">
                    <!-- Selezione dell'operazione -->
                    <div class="col-md-6">
                        <label for="operazione" class="form-label fw-semibold">Azione</label>
                        <select name="operazione" id="operazione" class="form-select" required>
                            <option value="aumenta" selected>Aumenta scorte (+)</option>
                            <option value="diminuisci">Diminuisci scorte (-)</option>
                        </select>
                    </div>

                    <!-- Quantità da variare -->
                    <div class="col-md-6">
                        <label for="quantita" class="form-label fw-semibold">Quantità</label>
                        <input type="number" name="quantita" id="quantita" class="form-control" min="1" value="1" required>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-wing-primary fw-semibold">
                        <i class="bi bi-save me-1"></i> Salva Modifiche
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
