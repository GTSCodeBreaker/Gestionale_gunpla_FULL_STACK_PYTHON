{% extends "base.html" %}

{% block title %}Modifica Kit #{{ gunpla.id_gunpla }} | Wing Zero ERP{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h2 class="fw-bold mb-0">Modifica Gunpla #{{ gunpla.id_gunpla }}</h2>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-sm">Annulla</a>
        </div>

        <div class="card card-wing p-4 shadow-sm">
            <form action="{{ url_for('modifica_gunpla', id_gunpla=gunpla.id_gunpla) }}" method="POST">
                
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nome Modello</label>
                    <input type="text" name="nome_modello" class="form-control" value="{{ gunpla.nome_modello }}" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Prezzo (&euro;)</label>
                        <input type="number" step="0.01" name="prezzo" class="form-control" value="{{ gunpla.prezzo }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Quantità in Stock</label>
                        <input type="number" name="quantita" class="form-control" value="{{ gunpla.quantita }}" required>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-wing-primary fw-semibold">
                        <i class="bi bi-save me-1"></i> Salva Modifiche
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
